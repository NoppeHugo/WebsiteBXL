# Services dynamiques du VPS.
#
# Les sites vitrines ne sont pas ici : ils sont statiques, servis directement
# par Caddy depuis le disque, sans aucun processus par client. Seule l'API a
# besoin d'un service et d'une base.

name: bxl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bxl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
      POSTGRES_DB: bxl
    volumes:
      - db-data:/var/lib/postgresql/data
      # Sauvegardes déposées ici par la tâche planifiée du VPS.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bxl -d bxl"]
      interval: 10s
      timeout: 5s
      retries: 5
    # La base n'est jamais exposée à l'extérieur : seule l'API l'atteint,
    # par le réseau interne de Compose.
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bxl:${POSTGRES_PASSWORD}@db:5432/bxl
      NODE_ENV: production
      # `resend` ou `smtp`. Ce n'est plus Compose qui exige la clé Resend :
      # avec un relais SMTP elle n'existe pas, et un `:?` ici empêcherait le
      # service de démarrer pour une valeur dont il n'a pas besoin. C'est
      # `apps/api/src/config.ts` qui vérifie, au démarrage, que le driver
      # choisi dispose bien de ce qu'il lui faut — et `log` y reste refusé.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?expéditeur requis}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PORT: 3000
    # Publié uniquement sur la boucle locale : c'est le serveur web de l'hôte
    # qui expose le service au monde, avec HTTPS et les en-têtes de sécurité.
    #
    # 3020 côté hôte, et non 3000 : sur ce VPS 3000 est déjà pris par un autre
    # projet (voir §0 bis, point 4). Le port interne au conteneur reste 3000 —
    # seule la publication change. Doit rester cohérent avec le proxy_pass de
    # infra/nginx/api.conf.modele.
    ports:
      - "127.0.0.1:3020:3000"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bxl:${POSTGRES_PASSWORD}@db:5432/bxl
      NODE_ENV: production
      PORT: 4000
      REPO_PATH: /repo
      SESSION_SECRET: ${SESSION_SECRET:?secret de session requis}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-}
      # L'interface écrit au client final quand le salon annule un
      # rendez-vous. En production, `log` fait refuser le démarrage : un
      # client non prévenu se déplace pour rien.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Le clone du dépôt sur le VPS : la console y écrit les site.json,
      # commite et pousse. Git reste la source de vérité du contenu.
      - ${REPO_PATH:?chemin du dépôt requis}:/repo
      # Clé SSH en lecture seule, pour pousser vers GitHub et déployer.
      - ${SSH_KEY_PATH:?clé SSH requise}:/root/.ssh/id_ed25519:ro
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  db-data:
