# Services dynamiques du VPS.
#
# Les sites vitrines ne sont pas ici : ils sont statiques, servis directement
# par Caddy depuis le disque, sans aucun processus par client. Seule l'API a
# besoin d'un service et d'une base.

name: bxl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bxl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
      POSTGRES_DB: bxl
    volumes:
      - db-data:/var/lib/postgresql/data
      # Sauvegardes déposées ici par la tâche planifiée du VPS.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bxl -d bxl"]
      interval: 10s
      timeout: 5s
      retries: 5
    # La base n'est jamais exposée à l'extérieur : seule l'API l'atteint,
    # par le réseau interne de Compose.
    expose:
      - "5432"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bxl:${POSTGRES_PASSWORD}@db:5432/bxl
      NODE_ENV: production
      # `resend` ou `smtp`. Ce n'est plus Compose qui exige la clé Resend :
      # avec un relais SMTP elle n'existe pas, et un `:?` ici empêcherait le
      # service de démarrer pour une valeur dont il n'a pas besoin. C'est
      # `apps/api/src/config.ts` qui vérifie, au démarrage, que le driver
      # choisi dispose bien de ce qu'il lui faut — et `log` y reste refusé.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?expéditeur requis}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PORT: 3000
    # Publié uniquement sur la boucle locale : c'est le serveur web de l'hôte
    # qui expose le service au monde, avec HTTPS et les en-têtes de sécurité.
    #
    # 3020 côté hôte, et non 3000 : sur ce VPS 3000 est déjà pris par un autre
    # projet (voir §0 bis, point 4). Le port interne au conteneur reste 3000 —
    # seule la publication change. Doit rester cohérent avec le proxy_pass de
    # infra/nginx/api.conf.modele.
    ports:
      - "127.0.0.1:3020:3000"

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      # L'image doit connaître le compte sous lequel elle tournera : ssh exige
      # que l'UID ait un nom et un répertoire personnel.
      args:
        DEPLOY_UID: ${DEPLOY_UID:-1002}
        DEPLOY_GID: ${DEPLOY_GID:-1002}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Le conteneur emprunte l'identité du compte qui possède le dépôt sur
    # l'hôte. Sans cela il tourne en root, et git refuse d'ouvrir un dépôt
    # appartenant à quelqu'un d'autre : « detected dubious ownership ». Toutes
    # les écritures de la console échouaient alors — enregistrer, pousser,
    # rafraîchir — sans que le service paraisse en panne.
    user: "${DEPLOY_UID:-1002}:${DEPLOY_GID:-1002}"
    # `host-gateway` donne au conteneur un nom pour joindre la machine qui
    # l'héberge : c'est par là que passe la publication (voir repo.ts).
    extra_hosts:
      - "hote:host-gateway"
    environment:
      DATABASE_URL: postgres://bxl:${POSTGRES_PASSWORD}@db:5432/bxl
      NODE_ENV: production
      PORT: 4000
      REPO_PATH: /repo
      # Le répertoire personnel créé dans l'image pour ce compte. Sans HOME
      # accessible en écriture, ssh et git tentent d'écrire là où ils n'ont pas
      # de droits, et échouent.
      HOME: /home/app
      # La clé et les hôtes connus sont montés plus bas ; git doit se les voir
      # désigner explicitement, il ne les cherche que dans ~/.ssh.
      GIT_SSH_COMMAND: "ssh -i /ssh/id_ed25519 -o UserKnownHostsFile=/ssh/known_hosts -o IdentitiesOnly=yes"
      SSH_KEY: /ssh/id_ed25519
      PUBLISH_HOST: ${PUBLISH_HOST:-}
      # Le même dépôt, vu depuis l'hôte : c'est là que tourne la publication.
      PUBLISH_REPO: ${REPO_PATH:?chemin du dépôt requis}
      SESSION_SECRET: ${SESSION_SECRET:?secret de session requis}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-}
      # L'interface écrit au client final quand le salon annule un
      # rendez-vous. En production, `log` fait refuser le démarrage : un
      # client non prévenu se déplace pour rien.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Le clone du dépôt sur le VPS : la console y écrit les site.json,
      # commite et pousse. Git reste la source de vérité du contenu.
      - ${REPO_PATH:?chemin du dépôt requis}:/repo
      # Clé SSH en lecture seule : elle sert à pousser vers GitHub et à
      # demander une publication à l'hôte. Déposée dans /ssh et non dans
      # /root/.ssh — le conteneur ne tourne plus en root, et /root lui est
      # devenu inaccessible.
      - ${SSH_KEY_PATH:?clé SSH requise}:/ssh/id_ed25519:ro
      # Empreinte de github.com, pour que le push ne bute pas sur une question
      # d'hôte inconnu à laquelle personne ne peut répondre.
      - ${SSH_KNOWN_HOSTS:-/home/deploy/.ssh/known_hosts}:/ssh/known_hosts:ro
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  db-data:
