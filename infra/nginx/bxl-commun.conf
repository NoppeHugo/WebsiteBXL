# Équivalent nginx du fragment « (commun) » de infra/Caddyfile.
#
# À déposer dans /etc/nginx/snippets/bxl-commun.conf, puis à appeler depuis
# chaque bloc server de ce projet avec « include snippets/bxl-commun.conf; ».
#
# Pourquoi ce fichier existe : ce VPS sert déjà quatre sites avec nginx, et le
# §0 bis retient l'option 1 — garder le serveur web en place plutôt que de lui
# substituer Caddy. Les fichiers produits par `pnpm caddy` ne servent donc pas ;
# voici leur équivalent. Tout ce qui suit reproduit le fragment Caddy à
# l'identique, sauf mention contraire.

# Caddy : « encode zstd gzip ». nginx ne compresse pas en zstd sans module
# tiers ; gzip seul, que tous les navigateurs lisent.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/javascript
           application/json image/svg+xml application/rss+xml;
gzip_min_length 1024;

# Les sites sont statiques : pas de scripts tiers, pas de cookies.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Caddy : « -Server ». nginx ne sait pas supprimer l'en-tête sans le module
# headers-more ; il sait en revanche le réduire au seul mot « nginx », sans
# numéro de version — c'est le numéro qui renseigne un attaquant.
server_tokens off;
