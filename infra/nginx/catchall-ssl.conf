# Hôte par défaut en HTTPS — refuse tout nom non configuré.
#
# À déposer dans /etc/nginx/sites-available/ puis à activer, comme les autres.
#
# Pourquoi c'est nécessaire, et pas seulement propre :
#
# Le §4 fait créer un enregistrement DNS générique (`*`), pour qu'un nouveau
# client ne demande aucune action chez le registrar. Conséquence : *tous* les
# sous-domaines imaginables arrivent sur ce serveur, y compris ceux qui ne
# correspondent à aucun site. nginx sert alors le premier bloc `server` qui
# écoute en 443 — le premier dans l'ordre alphabétique des fichiers, ce qui
# n'a aucun rapport avec ce qui serait souhaitable.
#
# Sur cette machine, ce premier bloc était `admin.<domaine>` : n'importe quel
# nom inventé servait la console d'administration, et l'exposait là où personne
# ne pense à aller la chercher.
#
# `ssl_reject_handshake` (nginx ≥ 1.19.4) refuse la poignée de main TLS sans
# rien servir et sans avoir besoin d'un certificat — le client reçoit une
# erreur de connexion, ce qui est la réponse juste pour un hôte qui n'existe
# pas.
#
# Le port 80 n'est pas touché : c'est par lui que passent les validations
# Let's Encrypt (HTTP-01), et le priver de son hôte par défaut casserait le
# renouvellement des certificats.

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_reject_handshake on;
}
