name: Contrôle et build

# Premier des deux garde-fous du monorepo (README §6) : rien ne peut partir en
# production si le contrôle des données ou le build d'un client échoue. Le
# second garde-fou est le déploiement par releases + lien symbolique, qui ne
# bascule le site en ligne qu'une fois la copie terminée.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Relecture des types. Node exécute les .ts en effaçant simplement les
      # types, sans jamais les vérifier : sans cette étape, une erreur de type
      # ne se manifeste qu'en production.
      - run: pnpm typecheck

      # Tests des chemins où une erreur coûte de l'argent ou expose des
      # données : contrat de contenu, authentification, défenses de l'API.
      - run: pnpm test

      # Validation de tous les clients : format, photos référencées,
      # traductions manquantes dans les langues vendues.
      - run: pnpm check

      # Build de tous les sites. Un template cassé fait échouer ici, avant
      # d'atteindre le moindre client.
      - run: pnpm build:all
